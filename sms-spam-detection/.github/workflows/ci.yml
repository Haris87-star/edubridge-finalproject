name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and API tests
        run: python -m pytest -q

  image:
    name: docker build + deploy smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sms-spam-detector:ci .

      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SPAM_ADMIN_TOKEN=ci-token \
            sms-spam-detector:ci

      - name: Smoke test the running service
        run: python3 scripts/smoke_test.py --url http://localhost:8000 --wait 60

      - name: Container logs
        if: always()
        run: docker logs api

      - name: Stop container
        if: always()
        run: docker rm -f api
