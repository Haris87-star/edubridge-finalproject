<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SMS Spam Detector</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #141a2e;
    --card-2: #1b2340;
    --text: #e8ecf8;
    --muted: #94a0bf;
    --accent: #6366f1;
    --accent-2: #818cf8;
    --spam: #f05252;
    --ham: #10b981;
    --border: #26304d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #1d2445 0%, var(--bg) 55%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  .shell { width: 100%; max-width: 820px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #22d3ee);
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
    color: #0b1020; letter-spacing: -0.5px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.2px; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
  .dot.ok { background: var(--ham); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
  .dot.bad { background: var(--spam); box-shadow: 0 0 0 3px rgba(240,82,82,.15); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  label.block { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 120px; resize: vertical; padding: 14px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--card-2);
    color: var(--text); font-size: 15px; line-height: 1.5; font-family: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    padding: 6px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
    transition: .15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  button.primary {
    margin-left: auto; border: 0; cursor: pointer; padding: 11px 22px;
    border-radius: 11px; font-size: 14px; font-weight: 600; color: white;
    background: linear-gradient(135deg, var(--accent), #4f46e5);
    transition: transform .1s ease, filter .15s ease;
  }
  button.primary:hover { filter: brightness(1.12); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .6; cursor: progress; }

  .threshold { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  input[type=range] { width: 130px; accent-color: var(--accent); }

  #result { margin-top: 20px; display: none; }
  #result.show { display: block; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .verdict { display: flex; align-items: baseline; gap: 12px; }
  .verdict .label { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
  .verdict .label.spam { color: var(--spam); }
  .verdict .label.ham { color: var(--ham); }
  .verdict .prob { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .bar { height: 8px; border-radius: 999px; background: var(--card-2); margin: 14px 0 18px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .bar > span.spam { background: linear-gradient(90deg, #f59e0b, var(--spam)); }
  .bar > span.ham { background: linear-gradient(90deg, #34d399, var(--ham)); }

  .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .terms { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .term {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    padding: 5px 9px; border-radius: 8px; border: 1px solid transparent;
  }
  .term.up { background: rgba(240,82,82,.12); color: #ffa2a2; border-color: rgba(240,82,82,.35); }
  .term.down { background: rgba(16,185,129,.12); color: #6ee7b7; border-color: rgba(16,185,129,.35); }

  .error { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px;
    background: rgba(240,82,82,.1); border: 1px solid rgba(240,82,82,.35); color: #ffb4b4; display: none; }
  .error.show { display: block; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .stat span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stat strong { font-size: 18px; font-weight: 650; }
  footer { margin-top: 22px; font-size: 12px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--accent-2); text-decoration: none; }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    button.primary { margin-left: 0; width: 100%; }
    .threshold { width: 100%; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">SMS</div>
    <div>
      <h1>SMS Spam Detector</h1>
      <p>TF-IDF + linear classifier &middot; served by FastAPI</p>
    </div>
    <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></div>
  </header>

  <section class="card">
    <label class="block" for="message">Message to analyse</label>
    <textarea id="message" placeholder="Paste an SMS message here…" spellcheck="false"></textarea>
    <div class="examples" id="examples"></div>

    <div class="row">
      <div class="threshold">
        <span>Threshold</span>
        <input type="range" id="threshold" min="0.05" max="0.95" step="0.05" value="0.5" />
        <b id="threshold-value">0.50</b>
      </div>
      <button class="primary" id="submit">Check message</button>
    </div>

    <div class="error" id="error"></div>
  </section>

  <section class="card" id="result">
    <div class="verdict">
      <span class="label" id="verdict-label">HAM</span>
      <span class="prob" id="verdict-prob">0% spam</span>
    </div>
    <div class="bar"><span id="verdict-bar"></span></div>
    <div class="meta">
      <span>confidence <b id="meta-confidence">–</b></span>
      <span>threshold <b id="meta-threshold">–</b></span>
      <span>latency <b id="meta-latency">–</b></span>
      <span>model <b id="meta-model">–</b></span>
    </div>
    <div class="terms" id="terms"></div>
  </section>

  <div class="stats">
    <div class="stat"><span>Test accuracy</span><strong id="stat-accuracy">–</strong></div>
    <div class="stat"><span>Spam precision</span><strong id="stat-precision">–</strong></div>
    <div class="stat"><span>Spam recall</span><strong id="stat-recall">–</strong></div>
    <div class="stat"><span>ROC AUC</span><strong id="stat-auc">–</strong></div>
  </div>

  <footer>
    <span id="footer-model">model: –</span>
    <a href="/docs">API docs</a>
    <a href="/metrics">Prometheus metrics</a>
  </footer>
</div>

<script>
  const EXAMPLES = [
    "Congratulations! You have won a £1000 cash prize. Call 0800 123 4567 to claim now!",
    "Hey, are we still meeting for lunch tomorrow at 1?",
    "URGENT: your account will be suspended. Verify your details at http://secure-login.example",
    "Free entry! Text WIN to 87121 to receive your guaranteed bonus."
  ];

  const $ = (id) => document.getElementById(id);
  let modelVersion = "unknown";

  const examples = $("examples");
  EXAMPLES.forEach((text) => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.type = "button";
    chip.textContent = text.length > 38 ? text.slice(0, 36) + "…" : text;
    chip.onclick = () => { $("message").value = text; $("message").focus(); };
    examples.appendChild(chip);
  });

  $("threshold").addEventListener("input", (event) => {
    $("threshold-value").textContent = Number(event.target.value).toFixed(2);
  });

  function showError(message) {
    const box = $("error");
    box.textContent = message;
    box.classList.add("show");
  }

  function clearError() { $("error").classList.remove("show"); }

  function pct(value, digits = 1) { return (value * 100).toFixed(digits) + "%"; }

  async function loadModelInfo() {
    try {
      const response = await fetch("/model/info");
      if (!response.ok) throw new Error("model info unavailable");
      const info = await response.json();
      modelVersion = info.version;
      $("status-dot").className = "dot ok";
      $("status-text").textContent = "online";

      const spam = info.spam_metrics || {};
      $("stat-accuracy").textContent = info.metrics?.accuracy != null ? pct(info.metrics.accuracy, 2) : "–";
      $("stat-precision").textContent = spam.precision != null ? pct(spam.precision, 2) : "–";
      $("stat-recall").textContent = spam.recall != null ? pct(spam.recall, 2) : "–";
      $("stat-auc").textContent = info.metrics?.roc_auc != null ? info.metrics.roc_auc.toFixed(3) : "–";
      $("footer-model").textContent = `model: ${info.name} · v${info.version} · ${info.dataset?.rows ?? "?"} messages`;
    } catch (error) {
      $("status-dot").className = "dot bad";
      $("status-text").textContent = "model offline";
    }
  }

  async function analyse() {
    clearError();
    const text = $("message").value.trim();
    if (!text) { showError("Type a message first."); return; }

    const button = $("submit");
    button.disabled = true;
    button.textContent = "Analysing…";

    try {
      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          explain: true,
          threshold: Number($("threshold").value)
        })
      });

      const data = await response.json();
      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
        throw new Error(detail || `request failed (${response.status})`);
      }

      const isSpam = data.label === "spam";
      const label = $("verdict-label");
      label.textContent = isSpam ? "SPAM" : "HAM";
      label.className = "label " + (isSpam ? "spam" : "ham");

      $("verdict-prob").textContent = pct(data.spam_probability, 1) + " spam probability";
      const bar = $("verdict-bar");
      bar.className = isSpam ? "spam" : "ham";
      bar.style.width = Math.max(2, data.spam_probability * 100) + "%";

      $("meta-confidence").textContent = pct(data.confidence, 1);
      $("meta-threshold").textContent = data.threshold.toFixed(2);
      $("meta-latency").textContent = data.latency_ms.toFixed(1) + " ms";
      $("meta-model").textContent = data.model.version;

      const terms = $("terms");
      terms.innerHTML = "";
      (data.explanation || []).forEach((term) => {
        const span = document.createElement("span");
        span.className = "term " + (term.weight > 0 ? "up" : "down");
        span.textContent = `${term.token} ${term.weight > 0 ? "+" : ""}${term.weight.toFixed(2)}`;
        span.title = term.weight > 0 ? "pushes towards spam" : "pushes towards ham";
        terms.appendChild(span);
      });

      $("result").classList.add("show");
    } catch (error) {
      showError("Could not classify: " + error.message);
    } finally {
      button.disabled = false;
      button.textContent = "Check message";
    }
  }

  $("submit").addEventListener("click", analyse);
  $("message").addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") analyse();
  });

  loadModelInfo();
</script>
</body>
</html>
