[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["api/static", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Header() belong in argument defaults
    "B904",  # raise ... from exc is enforced where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
